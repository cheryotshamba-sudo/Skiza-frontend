<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PesaCash - Spin & Win</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    margin-top:20px;
    font-size:32px;
    font-weight:900;
}

p{
    margin-top:10px;
    color:#cbd5e1;
}

.wheel-wrapper{
    position:relative;
    width:320px;
    height:320px;
    margin:40px auto;
}

.pointer{
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:35px solid red;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:-10px;
    z-index:5;
}


.wheel{

    width:320px;
    height:320px;
    border-radius:50%;
    border:8px solid white;

    position:relative;

    transition:transform 5s cubic-bezier(.17,.67,.83,.67);

    background:
    conic-gradient(
    #16a34a 0deg 60deg,
    #facc15 60deg 120deg,
    #2563eb 120deg 180deg,
    #f97316 180deg 240deg,
    #9333ea 240deg 300deg,
    #dc2626 300deg 360deg
    );
}


.amount{

    position:absolute;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding-top:35px;

    font-size:16px;
    font-weight:900;
    color:white;

    text-shadow:1px 1px 3px black;

}


.amount1{transform:rotate(30deg);}
.amount2{transform:rotate(90deg);}
.amount3{transform:rotate(150deg);}
.amount4{transform:rotate(210deg);}
.amount5{transform:rotate(270deg);}
.amount6{transform:rotate(330deg);}



button{

    background:#00c853;
    color:white;

    border:none;

    padding:16px 45px;

    font-size:22px;

    font-weight:900;

    border-radius:50px;

    cursor:pointer;

    box-shadow:0 0 15px #00c853;

}



.result{

    margin-top:25px;

    font-size:24px;

    font-weight:900;

    display:none;

}


</style>

</head>


<body>


<h1>PESACASH</h1>

<p>Spin gurudumu lako kupata zawadi</p>



<div class="wheel-wrapper">


<div class="pointer"></div>


<div class="wheel" id="wheel">

<div class="amount amount1">KSh 1,000</div>

<div class="amount amount2">KSh 2,000</div>

<div class="amount amount3">KSh 3,000</div>

<div class="amount amount4">KSh 4,000</div>

<div class="amount amount5">KSh 5,000</div>

<div class="amount amount6">TRY AGAIN</div>


</div>


</div>



<button onclick="spin()">SPIN NOW</button>


<div class="result" id="result">
</div>



<script>


let wheel=document.getElementById("wheel");

let result=document.getElementById("result");


function spin(){


let rotation = 360 * 5 + 90;


wheel.style.transform="rotate("+rotation+"deg)";



setTimeout(function(){


result.style.display="block";

result.innerHTML="🎉 Hongera! Umeshinda KSh 2,000";


},5000);



}


</script>


</body>

</html>
