<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Wheel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f8ff;
    text-align: center;
    padding: 30px 15px;
}

h1 {
    color: #0b7a3d;
}

.wheel-container {
    margin: 30px auto;
    width: 280px;
    height: 280px;
    position: relative;
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #222;
    background: conic-gradient(
        #0b7a3d 0deg 60deg,
        #ffd700 60deg 120deg,
        #2196f3 120deg 180deg,
        #ff5722 180deg 240deg,
        #9c27b0 240deg 300deg,
        #4caf50 300deg 360deg
    );
    transition: transform 4s ease;
}

button {
    margin-top: 25px;
    padding: 15px 40px;
    border: none;
    border-radius: 30px;
    background: #0b7a3d;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.arrow {
    font-size: 35px;
}
</style>

</head>

<body>

<h1>🎡 Spin The Wheel</h1>

<p>Spin the wheel to continue</p>

<div class="arrow">⬇️</div>

<div class="wheel-container">
    <div class="wheel" id="wheel"></div>
</div>

<button onclick="spinWheel()">
    SPIN NOW
</button>


<script>
function spinWheel() {

    let wheel = document.getElementById("wheel");

    let randomSpin = 1800 + Math.floor(Math.random() * 1000);

    wheel.style.transform = "rotate(" + randomSpin + "deg)";

    setTimeout(function(){
        window.location.href="result.html";
    },4500);

}
</script>

</body>
</html>
