<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PESACASH Spin Wheel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

h1{
    font-size:36px;
    font-weight:900;
    margin-bottom:10px;
}

.caption{
    color:#d1d5db;
    font-size:17px;
    line-height:1.5;
    margin-bottom:30px;
}

.wheel-container{
    position:relative;
    width:340px;
    height:340px;
    margin:auto;
}

.pointer{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:35px solid #ef4444;
    z-index:20;
}

.wheel{
    width:340px;
    height:340px;
    border-radius:50%;
    border:8px solid #fff;
    overflow:hidden;
    position:relative;
    transition:transform 5s cubic-bezier(.17,.67,.25,1);

    background:conic-gradient(
        #16a34a 0deg 30deg,
        #facc15 30deg 60deg,
        #2563eb 60deg 90deg,
        #f97316 90deg 120deg,
        #9333ea 120deg 150deg,
        #dc2626 150deg 180deg,
        #14b8a6 180deg 210deg,
        #ec4899 210deg 240deg,
        #84cc16 240deg 270deg,
        #0ea5e9 270deg 300deg,
        #f97316 300deg 330deg,
        #8b5cf6 330deg 360deg
    );
}

.amount{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:18px;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    text-shadow:1px 1px 3px #000;
}

.a1{transform:rotate(15deg);}
.a2{transform:rotate(45deg);}
.a3{transform:rotate(75deg);}
.a4{transform:rotate(105deg);}
.a5{transform:rotate(135deg);}
.a6{transform:rotate(165deg);}
.a7{transform:rotate(195deg);}
.a8{transform:rotate(225deg);}
.a9{transform:rotate(255deg);}
.a10{transform:rotate(285deg);}
.a11{transform:rotate(315deg);}
.a12{transform:rotate(345deg);}

.spin-btn{
    margin-top:35px;
    background:#00c853;
    color:#fff;
    border:none;
    padding:16px 48px;
    font-size:22px;
    font-weight:900;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 0 18px rgba(0,200,83,.7);
}

.popup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.7);
    z-index:100;
}

.popup-box{
    background:#fff;
    color:#111827;
    width:90%;
    max-width:340px;
    padding:30px 20px;
    border-radius:18px;
    text-align:center;
}

.popup-box h2{
    color:#16a34a;
    margin-bottom:12px;
}

.popup-box p{
    font-size:18px;
    margin-bottom:20px;
}

.continue-btn{
    background:#00c853;
    color:#fff;
    border:none;
    padding:14px 35px;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h1>PESACASH</h1>

<p class="caption">
Spin the wheel for your chance to win exciting cash rewards up to KSh 5,000.
</p>

<div class="wheel-container">

<div class="pointer"></div>

<div class="wheel" id="wheel">
    <div class="amount a1">KSh 300</div>
<div class="amount a2">KSh 500</div>
<div class="amount a3">KSh 800</div>
<div class="amount a4">KSh 1,000</div>
<div class="amount a5">KSh 1,500</div>
<div class="amount a6">KSh 2,000</div>
<div class="amount a7">KSh 2,500</div>
<div class="amount a8">KSh 3,000</div>
<div class="amount a9">KSh 3,500</div>
<div class="amount a10">KSh 4,000</div>
<div class="amount a11">KSh 4,500</div>
<div class="amount a12">KSh 5,000</div>

</div>
</div>

<button class="spin-btn" id="spinBtn">
    SPIN NOW
</button>
<div class="popup" id="popup">
    <div class="popup-box">

        <h2>🎉 Congratulations!</h2>

        <p id="winText"></p>

        <button class="continue-btn"
    onclick="goToResult()">
    CONTINUE
</button>

    </div>
</div>

<script>

const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spinBtn");
const popup = document.getElementById("popup");
const winText = document.getElementById("winText");

const prizes = [
    "KSh 300",
    "KSh 500",
    "KSh 800",
    "KSh 1,000",
    "KSh 1,500",
    "KSh 2,000",
    "KSh 2,500",
    "KSh 3,000",
    "KSh 3,500",
    "KSh 4,000",
    "KSh 4,500",
    "KSh 5,000"
];

let currentRotation = 0;
let spinning = false;
let prizeIndex = 0;


// Check if already played
if(localStorage.getItem("wheelPlayed") === "true"){
    spinBtn.disabled = true;
    spinBtn.textContent = "ALREADY SPUN";
}


spinBtn.addEventListener("click", function(){

    if(spinning) return;


    spinning = true;

    popup.style.display = "none";

    spinBtn.textContent = "SPINNING...";
    spinBtn.style.opacity = "0.6";


    // Select winning prize
    prizeIndex = Math.floor(Math.random() * prizes.length);


    // Calculate stopping angle
    let stopAngle = (360 - (prizeIndex * 30)) - 15;


    // Spin 6 full rounds + stop position
    currentRotation += (360 * 6) + stopAngle;


    wheel.style.transition = "transform 5s cubic-bezier(.17,.67,.25,1)";
    wheel.style.transform = `rotate(${currentRotation}deg)`;


    setTimeout(function(){


        // Save result
        localStorage.setItem(
            "winningAmount",
            prizes[prizeIndex]
        );


        localStorage.setItem(
            "wheelPlayed",
            "true"
        );


        winText.textContent =
        "Congratulations! You have won " + prizes[prizeIndex] + "!";


        popup.style.display = "flex";


        spinning = false;

        spinBtn.style.opacity = "1";

        spinBtn.disabled = true;

        spinBtn.textContent = "COMPLETED";


    },5000);


});


function goToResult(){

    window.location.href = "result.html";

}


// Prevent returning back to wheel
history.pushState(null, "", location.href);

window.addEventListener("popstate", function(){

    history.pushState(null, "", location.href);

});


</script>


    


    


</body>
</html>
