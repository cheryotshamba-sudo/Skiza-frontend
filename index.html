<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesa Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="video-container">

    <video id="promoVideo" playsinline>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="playOverlay">
        <button id="playBtn">▶</button>
        <p>Tap Play to Watch Video</p>
    </div>

</div>

<div class="bottom-section">

    <button class="start-btn" onclick="startNow()">
        🎯 Start Spinning Now
    </button>

    <div class="live-box">
        <p id="liveText">
            🔥 1,254 Kenyans have already spun today.
        </p>
    </div>

    <p class="terms">
        Limited offer for Kenyan users. Terms apply.
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
