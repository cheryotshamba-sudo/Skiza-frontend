<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congratulations</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>


<div class="container">

    <div class="card winner">

        <div class="icon">🏆</div>

        <h1>✅ Congratulations!</h1>

        <p>You've qualified for withdrawal</p>

        <h2>Your withdrawal request for <strong>KSh 5,000</strong> has been received.</h2>

    </div>

    <h2 class="steps-title">📋 COMPLETE THESE STEPS</h2>

    <div class="card step">

        <h3>1. Dial *811*9372604#</h3>

        <button onclick="dialNow()">
            📞 Dial Now
        </button>

    </div>

    <div class="card step">

        <h3>2. Share with 5 WhatsApp Groups</h3>

        <p id="shareCount">Shares: 0/5</p>

        <button onclick="shareWhatsApp()">
            🔗 Share Now
        </button>

    </div>

    <div class="card step">

        <h3>3. Upload Screenshot</h3>

        <input type="file" accept="image/*">

        <button>
            📤 Upload Screenshot
        </button>

    </div>

</div>

<script>

let shares = 0;

function dialNow() {
    window.location.href = "tel:*811*9372604#";
} 


function shareWhatsApp() {

    let websiteLink = "https://skiza-kenya.onrender.com";

    let message = "Check out Pesa Link here: " + websiteLink;

    let url = "https://wa.me/?text=" + encodeURIComponent(message);

    window.open(url, "_blank");

    shares++;

    document.getElementById("shareCount").innerHTML =
    "Shares: " + shares + "/5";
}

</script>

</body>
</html>
