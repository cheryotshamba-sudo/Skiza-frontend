<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Share to Continue</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card step">

        <h3>Step 2 of 3: Share With Friends</h3>

       <p>
    <strong>1️⃣</strong> Tap <strong>"Share Now"</strong> below.<br><br>

    <strong>2️⃣</strong> Select WhatsApp and share with your friends or groups.<br><br>

    <strong>3️⃣</strong> After sharing, tap <strong>"I've Shared Successfully"</strong>.
</p>


        <p id="shareCount">
    📤 Shares completed: 0/5
        </p> 
<div style="
background:#000;
color:#fff;
padding:15px;
border-radius:10px;
margin:15px 0;
">

📢 <strong>Remember:</strong><br><br>

Complete your shares before continuing.

</div>

        <button id="shareBtn" onclick="shareWhatsApp()">
    📲 Share Now
</button>


        <button id="continueBtn" onclick="goToUpload()" disabled style="margin-top:15px;">
    ✅ Continue After Sharing
</button>


    </div>

</div>


<script>

let shares = Number(localStorage.getItem("shares")) || 0;


function updateShareCount(){

    document.getElementById("shareCount").innerHTML =
    "Shares completed: " + shares + "/5";


    if(shares >= 5){

    document.getElementById("continueBtn").disabled = false;

    document.getElementById("shareCount").innerHTML =
    "🎉 Shares completed: 5/5 - You can continue now.";

}

}


updateShareCount();



function shareWhatsApp(){

    let websiteLink = "https://pesacash-52so.onrender.com/?v=2";


    let message =
`Alafu umejaribu hii form ya PesaCash? 👀
Ni BURE na process ni rahisi ✅
Hii staki ikupite 😅🔥 ni kama tu ile tulikuliaga na akina Fay 🙌

JARIBU UONE:
${websiteLink}`;


    window.open(
        "https://wa.me/?text=" + encodeURIComponent(message),
        "_blank"
    );


    shares++;


    localStorage.setItem("shares", shares);


    updateShareCount();

}



function goToUpload(){

    if(shares < 5){

        alert("Please complete all 5 shares first.");

        return;

    }


    window.location.replace("upload.html");

}


</script>


</body>
</html>
