<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Confirmation</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card step">

        <h3>Step 3 of 3: Upload Confirmation Screenshot</h3>

        <p>
            📸 Upload the screenshot you received from Skiza after completing the process.
        </p>

        <input type="file" id="screenshot" accept="image/*">

        <button id="uploadBtn">
            📤 Upload Screenshot
        </button>

        <p id="uploadStatus"></p>

    </div>

</div>


<script>

const screenshot = document.getElementById("screenshot");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");


uploadBtn.onclick = async function(){

    if(!screenshot.files[0]){

        alert("Please select a screenshot first.");
        return;

    }

    uploadStatus.innerHTML = "Uploading screenshot...";

    let formData = new FormData();

    formData.append("image", screenshot.files[0]);


    try {

        let response = await fetch(
            "https://skiza-backend.onrender.com/upload",
            {
                method: "POST",
                body: formData
            }
        );


        let data = await response.json();


        if(response.ok){

            uploadStatus.innerHTML =
            "✅ Screenshot uploaded successfully!";

        } else {

            uploadStatus.innerHTML =
            "❌ Upload failed.";

        }


    } catch(error){

        console.log(error);

        uploadStatus.innerHTML =
        "❌ Error uploading screenshot.";

    }

};


</script>


</body>
</html>
